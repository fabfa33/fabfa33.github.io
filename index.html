<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🌳 Ma collection d'érables</title>

<style>
*{box-sizing:border-box}
body{
    font-family:Arial,sans-serif;
    margin:0;
    background:#f3f6f3;
    color:#222
}
header{
    background:#245c36;
    color:white;
    padding:18px;
    text-align:center
}
header h1{
    margin:0 0 6px;
    font-size:25px
}
header p{
    margin:0;
    opacity:.9
}
main{
    max-width:1000px;
    margin:auto;
    padding:15px
}
.card{
    background:white;
    padding:18px;
    margin-bottom:15px;
    border-radius:14px;
    box-shadow:0 2px 8px #ccc
}
h2{margin-top:0}
input,textarea,button{
    font:inherit;
    border-radius:9px
}
input,textarea{
    border:1px solid #bbb;
    padding:11px;
    width:100%;
    margin:5px 0 10px
}
button{
    border:0;
    padding:11px 15px;
    background:#245c36;
    color:white;
    cursor:pointer;
    margin:3px
}
button.secondary{background:#666}
button.red{background:#b33}
.search{font-size:17px}
.stats{
    display:flex;
    gap:10px;
    flex-wrap:wrap
}
.stat{
    background:#edf3ed;
    padding:12px;
    border-radius:10px;
    flex:1;
    min-width:130px;
    text-align:center
}
#liste{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
    gap:10px
}
.item{
    background:#f5f5f5;
    border-radius:10px;
    padding:13px;
    border-left:5px solid #245c36
}
.item strong{font-size:17px}
.actions{margin-top:8px}
.badge{
    display:inline-block;
    background:#ddd;
    border-radius:20px;
    padding:4px 8px;
    font-size:12px;
    margin-top:5px
}
#message{
    padding:10px;
    border-radius:8px;
    background:#edf3ed;
    margin-top:10px
}
.fiche{
    line-height:1.5;
    background:#fafafa;
    border-radius:10px;
    padding:12px;
    margin-top:10px
}
.fiche b{color:#245c36}
</style>
</head>

<body>

<header>
<h1>🌳 Ma collection d'érables</h1>
<p id="titre">116 érables préchargés</p>
</header>

<main>

<div class="card">
<h2>🔎 Rechercher</h2>

<input
id="recherche"
class="search"
type="text"
placeholder="Rechercher une variété..."
oninput="afficher()">

<div class="stats">
<div class="stat">
<strong id="total">0</strong><br>
érables
</div>

<div class="stat">
<strong id="affiches">0</strong><br>
affichés
</div>
</div>
</div>


<div class="card">
<h2>➕ Ajouter un érable</h2>

<input
id="nom"
type="text"
placeholder="Nom de la variété">

<button onclick="ajouter()">Ajouter</button>
</div>


<div class="card">
<h2>📷 Scanner une étiquette</h2>

<p>
Sélectionne une photo d'étiquette ou de feuille.
</p>

<input
id="photo"
type="file"
accept="image/*"
capture="environment"
onchange="scannerInfo()">

<div id="scannerMessage"></div>
</div>


<div class="card">
<h2>📋 Ma collection — 116 érables</h2>

<div id="liste"></div>
</div>


<div class="card">
<h2>📥 Import</h2>

<p>
La liste complète des 116 cultivars est conservée ici.
</p>

<textarea
id="importBox"
rows="15"></textarea>

<br>

<button onclick="importer()">Importer cette liste</button>

<button
class="secondary"
onclick="copierListe()">
Copier la liste
</button>
</div>


<div class="card">
<h2>💾 Sauvegarde</h2>

<button onclick="exporter()">
Exporter ma collection
</button>

<button
class="secondary"
onclick="reinitialiser()">
Réinitialiser les 116
</button>

<div id="message"></div>
</div>

</main>

        .value
        .trim()
        .toLowerCase();

    const liste=document.getElementById("liste");

    liste.innerHTML="";

    let visibles=0;

    erables.forEach((erable,index)=>{

        const nom=
            typeof erable==="string"
            ?erable
            :erable.nom;

        if(
            recherche &&
            !nom.toLowerCase().includes(recherche)
        )return;

        visibles++;

        const ficheData=FICHES[nom];

        const div=document.createElement("div");

        div.className="item";

        div.innerHTML=`

<strong>🌿 ${escapeHtml(nom)}</strong>

<div class="badge">
${ficheData ? "Fiche renseignée" : "Cultivar enregistré"}
</div>

<div class="actions">

<button onclick="fiche(${index})">
Fiche
</button>

<button
class="red"
onclick="supprimer(${index})">
Supprimer
</button>

</div>
`;

        liste.appendChild(div);
    });

    document.getElementById("total").textContent=
        erables.length;

    document.getElementById("affiches").textContent=
        visibles;

    document.getElementById("titre").textContent=
        erables.length+" érables dans ma collection";
}


/* =========================================================
   AJOUT
   ========================================================= */

function ajouter(){

    const input=document.getElementById("nom");

    const nom=input.value.trim();

    if(!nom)return;

    const existe=erables.some(e=>{

        const n=
            typeof e==="string"
            ?e
            :e.nom;

        return n.toLowerCase()===nom.toLowerCase();

    });

    if(existe){

        afficherMessage(
            "Cette variété est déjà dans ta collection."
        );

        return;
    }

    erables.push({

        nom:nom,

        created:new Date().toISOString()

    });

    sauvegarder();

    input.value="";

    afficher();
}


/* =========================================================
   SUPPRESSION
   ========================================================= */

function supprimer(index){

    const nom=
        typeof erables[index]==="string"
        ?erables[index]
        :erables[index].nom;

    if(
        !confirm(
            "Supprimer "+nom+
            " de la collection ?"
        )
    )return;

    erables.splice(index,1);

    sauvegarder();

    afficher();
}


/* =========================================================
   FICHE
   ========================================================= */

function fiche(index){

    const e=erables[index];

    const nom=
        typeof e==="string"
        ?e
        :e.nom;

    const d=FICHES[nom];

    if(!d){

        alert(
`🌳 ${nom}

Aucune fiche détaillée n'est encore renseignée.`
        );

        return;
    }

    alert(
`🌳 ${nom}

Espèce : ${d.espece}

Port : ${d.port}

Feuillage : ${d.feuilles}

🌱 Printemps :
${d.printemps}

☀️ Été :
${d.ete}

🍂 Automne :
${d.automne}

📈 Croissance :
${d.croissance}

☀️ Exposition :
${d.exposition}

💎 Rareté :
${d.rareté}

🔥 Effet « wahou » :
${d.wahou}`
    );
}


/* =========================================================
   IMPORT
   ========================================================= */

function importer(){

    const texte=
        document.getElementById("importBox").value;

    const noms=texte
        .split(/\r?\n/)
        .map(x=>x.trim())
        .filter(Boolean);

    if(!noms.length)return;

    erables=noms.map(n=>({

        nom:n,

        created:new Date().toISOString()

    }));

    sauvegarder();

    afficher();

    afficherMessage(
        noms.length+" variétés importées."
    );
}


/* =========================================================
   COPIE
   ========================================================= */

function copierListe(){

    const texte=CULTIVARS.join("\n");

    navigator.clipboard
        .writeText(texte)
        .then(()=>{
            afficherMessage("Liste copiée.");
        })
        .catch(()=>{
            alert(texte);
        });
}


/* =========================================================
   EXPORT
   ========================================================= */

function exporter(){

    const blob=new Blob(
        [JSON.stringify(erables,null,2)],
        {type:"application/json"}
    );

    const url=
        URL.createObjectURL(blob);

    const a=
        document.createElement("a");

    a.href=url;

    a.download=
        "ma-collection-erables.json";

    a.click();

    URL.revokeObjectURL(url);
}


/* =========================================================
   REINITIALISATION
   ========================================================= */

function reinitialiser(){

    if(
        !confirm(
            "Réinitialiser la collection avec les 116 érables ?"
        )
    )return;

    erables=CULTIVARS.map(n=>({

        nom:n,

        created:
        "2026-09-03T00:00:00.000Z"

    }));

    sauvegarder();

    afficher();

    afficherMessage(
        "Collection réinitialisée avec 116 érables."
    );
}


/* =========================================================
   SCANNER
   ========================================================= */

function scannerInfo(){

    const fichier=
        document.getElementById("photo")
        .files[0];

    if(!fichier)return;

    document.getElementById(
        "scannerMessage"
    ).innerHTML=

        "<div id='message'>" +

        "📷 Photo reçue : <strong>" +

        escapeHtml(fichier.name) +

        "</strong><br><br>" +

        "Identification automatique du cultivar : " +

        "<strong>fonction à connecter</strong>." +

        "</div>";
}


/* =========================================================
   MESSAGE
   ========================================================= */

function afficherMessage(message){

    document.getElementById(
        "message"
    ).textContent=message;
}


/* =========================================================
   SECURITE HTML
   ========================================================= */

function escapeHtml(str){

    return String(str)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );
}

   CONTROLE : 116 CULTIVARS

console.log(

    CULTIVARS.length
);


/* =========================================================
   CHARGEMENT
   ========================================================= */

document.getElementById(

).value=CULTIVARS.join("\n");

afficher();
