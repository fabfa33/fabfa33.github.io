<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🌳 Ma collection d'érables</title>

<meta name="theme-color" content="#245c36">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="icon" type="image/svg+xml"
href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 128 128'%3E%3Crect width='128' height='128' rx='28' fill='%23245c36'/%3E%3Cpath d='M64 20C47 34 28 52 28 73c0 20 15 35 36 35s36-15 36-35C100 52 81 34 64 20Z' fill='%23c85b3c'/%3E%3Cpath d='M64 40v64M64 57 45 45M64 68l20-13M64 80 45 68M64 89l18-10' fill='none' stroke='white' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">

<style>
*{
box-sizing:border-box;
}

body{
margin:0;
background:#f3f6f3;
color:#17301f;
font-family:Arial,Helvetica,sans-serif;
}

header{
background:#245c36;
color:white;
padding:18px 15px;
position:sticky;
top:0;
z-index:10;
box-shadow:0 2px 8px rgba(0,0,0,.2);
}

header h1{
margin:0 0 15px;
font-size:22px;
}

.tabs{
display:flex;
gap:8px;
}

.tabs button{
border:0;
border-radius:10px;
padding:9px 14px;
font-weight:bold;
background:rgba(255,255,255,.15);
color:white;
cursor:pointer;
}

.tabs button.active{
background:white;
color:#245c36;
}

.container{
max-width:1000px;
margin:auto;
padding:15px;
}

.stats{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;
margin-bottom:15px;
}

.stat{
background:white;
border-radius:14px;
padding:13px;
text-align:center;
box-shadow:0 2px 7px rgba(0,0,0,.08);
}

.stat strong{
display:block;
font-size:25px;
margin-bottom:3px;
}

.search{
width:100%;
padding:13px;
border:1px solid #ccd8ce;
border-radius:12px;
font-size:16px;
margin-bottom:12px;
}

.toolbar{
display:flex;
gap:8px;
flex-wrap:wrap;
margin-bottom:12px;
}

button.action,
label.action{
display:inline-block;
border:0;
border-radius:9px;
padding:9px 11px;
background:#e5efe7;
color:#174526;
font-weight:bold;
cursor:pointer;
}

button.danger{
background:#fde5e5;
color:#a00000;
}

.card{
background:white;
border-radius:15px;
padding:15px;
margin-bottom:11px;
box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.card h3{
margin:0 0 8px;
font-size:18px;
color:#245c36;
}

.card-info{
font-size:14px;
color:#59695e;
line-height:1.5;
}

.card-actions{
display:flex;
flex-wrap:wrap;
gap:7px;
margin-top:12px;
}

.hidden{
display:none!important;
}

.panel{
background:white;
padding:16px;
border-radius:15px;
box-shadow:0 2px 8px rgba(0,0,0,.08);
margin-bottom:15px;
}

.panel input{
width:100%;
padding:12px;
border:1px solid #ccd8ce;
border-radius:10px;
margin-bottom:10px;
font-size:16px;
}

.photo-grid{
display:flex;
flex-wrap:wrap;
gap:8px;
margin-top:12px;
}

.photo-box{
width:120px;
}

.photo-box img{
width:120px;
height:95px;
object-fit:cover;
border-radius:9px;
display:block;
}

.photo-box button{
width:100%;
margin-top:4px;
font-size:12px;
}

.notice{
padding:12px;
background:#fff8dc;
border-radius:10px;
margin-bottom:12px;
}

.empty{
text-align:center;
padding:30px 10px;
color:#69766d;
}

.small{
font-size:12px;
color:#69766d;
}

@media(max-width:600px){
.stats{
grid-template-columns:repeat(2,1fr);
}

.stat:last-child{
grid-column:span 2;
}
}
</style>
</head>

<body>

<header>
<h1>🌳 Ma collection d'érables</h1>

<div class="tabs">
<button class="active" onclick="showTab('collection',this)">
Collection
</button>

<button onclick="showTab('ajouter',this)">
Ajouter
</button>

<button onclick="showTab('outils',this)">
Outils
</button>
</div>
</header>


<div class="container">

<!-- COLLECTION -->

<section id="collection">

<div class="stats">

<div class="stat">
<strong id="total">116</strong>
érables
</div>

<div class="stat">
<strong id="located">0</strong>
localisés
</div>

<div class="stat">
<strong id="photoCount">0</strong>
photos
</div>

</div>


<input
id="search"
class="search"
type="search"
placeholder="🔎 Rechercher un érable..."
oninput="render()"
>


<div class="toolbar">

<button class="action" onclick="findNearest()">
📍 Trouver l'érable le plus proche
</button>

</div>


<div id="nearestBox" class="notice hidden"></div>

<div id="mapleList"></div>

</section>


<!-- AJOUTER -->

<section id="ajouter" class="hidden">

<div class="panel">

<h2>Ajouter un érable</h2>

<input
id="newMaple"
placeholder="Nom de la variété"
>

<button class="action" onclick="addMaple()">
➕ Ajouter
</button>

</div>

</section>


<!-- OUTILS -->

<section id="outils" class="hidden">

<div class="panel">

<h2>Outils</h2>

<button class="action" onclick="exportCollection()">
⬇️ Exporter la collection
</button>

<button class="action" onclick="document.getElementById('importFile').click()">
⬆️ Importer une collection
</button>

<input
id="importFile"
type="file"
accept=".json"
style="display:none"
onchange="importCollection(this)"
>

<p class="small">
L'export contient les noms et les positions GPS.
Les photos restent stockées dans le navigateur.
</p>

</div>

</section>

</div>


<script>

/* =========================================================
   LES 116 ÉRABLES
========================================================= */

const DEFAULT_MAPLES = [
"Mila",
"Azuma",
"F.Nakai",
"Purple ghost",
"Wood's linearilobum",
"Verkade's winter gold",
"Will's devine",
"Emmett's Pumpkin",
"Gimborn's élégant surprise",
"Oregon fern",
"Palmatifolium",
"Alpenweiss",

"Ikandi",
"Aka hosoda",
"Kawahara rose",
"Butterfly",
"Aureum",
"Metamorphosa",
"Inaba shidare",
"Shigitatsu",
"Ukigumo",
"Seryu",
"Beni Maiko",
"Sango Kaku",
"Rubrifolium",
"Katsura",
"Koto Hime",
"Lace Lady",
"Scolopendrifolium",
"Trompenburg",
"Akatayioo",
"Crimson Carole",
"Wilson Pink",
"Inazuma",
"Bi Hoo",
"Aconitifolium",
"Kujaku Bato",
"Cascade Gold",
"Phoenix",

"Veridis",
"Skeeter Broom",
"Shishigashira",

"Atropurpureum",
"Aka Shigitatsu Sawa",
"Reticulatum Red",
"Blood good",
"Osakazuki",
"Arakawa",
"Celebration",
"Wakakusa Yama",
"Autumn Moon",
"Alexandre 1",
"Orange Dream",
"Emerald Lace",
"Jerre Schwarts",
"Festival",
"Little Princess",
"Starfish",
"Summer gold",
"Going Green",
"Atrolineare",
"Ueno Yama",
"Shin deeshojo",
"Yoshi",
"Ryusen",
"Burgundy Lace",
"Shaina",
"Moonrise",
"Taylor",
"Mikawa Yatsubusa",
"Orangeola",
"Flavescens",
"Tamukeyama",
"Lileeane's jewel",
"Ariadne",
"Ellen",
"Koshimino",
"Nyaku Oji",
"Orange Lace",
"Dr Baker",
"Genji Yama",
"Mikazuki",
"Jordan",
"Geisha",
"Honoka",
"Ice Dragon",
"Manyo No Sato",
"North Wind",
"Artic Jade",
"Vitifolium",
"Hana Matoi",
"Rainbow",
"Arton",
"Baldsmith",
"Beni Kumo no su",
"Black Lace",
"Burgundy Lime",
"Hagoromo",
"Honoo",
"Kishuzan",
"Kuro Kami Yama",
"Mischa",
"Miss Piggy",
"Nathan",
"Nomura shidare",
"Ohjishi",
"Ornatum",
"Otome zakura",
"Pink Filigree",
"Red Strata",
"Red Wood",
"Seiun Kaku",
"Stella Rosa"
];


/* =========================================================
   STOCKAGE
========================================================= */

const STORAGE_KEY = "collection-erables-complete-v1";

let erables =
JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");


/*
   IMPORTANT :
   Si aucune collection n'existe encore,
   on crée réellement les 116 objets.
*/

if(!Array.isArray(erables) || erables.length === 0){

erables = DEFAULT_MAPLES.map(function(name){
return {
name:name,
gps:null
};
});

save();

}


/* =========================================================
   SAUVEGARDE
========================================================= */

function save(){

localStorage.setItem(
STORAGE_KEY,
JSON.stringify(erables)
);

}


/* =========================================================
   PROTECTION HTML
========================================================= */

function escapeHtml(text){

return String(text)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* =========================================================
   AFFICHAGE DES 116 ÉRABLES
========================================================= */

function render(){

const list =
document.getElementById("mapleList");

const search =
document.getElementById("search")
.value
.trim()
.toLowerCase();


const results =
erables
.map(function(maple,index){

return {
maple:maple,
index:index
};

})
.filter(function(item){

return item.maple.name
.toLowerCase()
.includes(search);

});


document.getElementById("total").textContent =
erables.length;


document.getElementById("located").textContent =
erables.filter(function(maple){

return maple.gps !== null;

}).length;


/*
   C'EST ICI QUE LES 116 FICHES
   SONT CRÉÉES INDIVIDUELLEMENT.
*/

if(results.length === 0){

list.innerHTML =
'<div class="empty">Aucun érable trouvé.</div>';

return;

}


list.innerHTML =
results
.map(function(item){

return createMapleCard(
item.maple,
item.index
);

})
.join("");


/*
   Charger les photos après création
   des fiches.
*/

results.forEach(function(item){

loadPhotos(item.index);

});

}


/* =========================================================
   CARTE INDIVIDUELLE
========================================================= */

function createMapleCard(maple,index){

let gpsText = "";

if(maple.gps){

gpsText =
"📍 " +
maple.gps.latitude.toFixed(6) +
", " +
maple.gps.longitude.toFixed(6) +
"<br>" +
"Précision : " +
Math.round(maple.gps.accuracy || 0) +
" m";

}else{

gpsText =
"📍 Position non enregistrée";

}


return `

<article class="card">

<h3>
${index + 1}. ${escapeHtml(maple.name)}
</h3>

<div class="card-info">

${gpsText}

</div>


<div class="card-actions">

<button
class="action"
onclick="locateMaple(${index})"
>
📍 ${maple.gps ? "Actualiser" : "Enregistrer ma position"}
</button>


${
maple.gps
?
`
<button
class="action"
onclick="clearLocation(${index})"
>
❌ Effacer position
</button>

<button
class="action"
onclick="openMaps(${index})"
>
🗺️ Carte
</button>
`
:
""
}


<label class="action">

📷 Ajouter photo

<input
type="file"
accept="image/*"
capture="environment"
multiple
style="display:none"
onchange="addPhotos(${index},this)"
>

</label>


<button
class="action danger"
onclick="deleteMaple(${index})"
>
🗑️ Supprimer
</button>

</div>


<div
id="photos-${index}"
class="photo-grid"
>
</div>

</article>

`;

}


/* =========================================================
   ONGLET
========================================================= */

function showTab(tabId,button){

document
.querySelectorAll("main section");


document
.querySelectorAll(".container > section")
.forEach(function(section){

section.classList.add("hidden");

});


document
.getElementById(tabId)
.classList.remove("hidden");


document
.querySelectorAll(".tabs button")
.forEach(function(btn){

btn.classList.remove("active");

});


button.classList.add("active");


if(tabId === "collection"){

render();

}

}


/* =========================================================
   AJOUTER UN ÉRABLE
========================================================= */

function addMaple(){

const input =
document.getElementById("newMaple");

const name =
input.value.trim();


if(!name){

alert("Entre le nom de l'érable.");

return;

}


erables.push({
name:name,
gps:null
});


save();

input.value = "";

render();

alert("Érable ajouté à la collection.");

}


/* =========================================================
   SUPPRIMER UN ÉRABLE
========================================================= */

function deleteMaple(index){

const name =
erables[index].name;


if(!confirm(
"Supprimer « " + name + " » de la collection ?"
)){

return;

}


deletePhotos(index);


erables.splice(index,1);

save();

render();

}


/* =========================================================
   GPS
========================================================= */

function locateMaple(index){

if(!navigator.geolocation){

alert(
"La géolocalisation n'est pas disponible sur cet appareil."
);

return;

}


navigator.geolocation.getCurrentPosition(

function(position){

erables[index].gps = {

latitude:
position.coords.latitude,

longitude:
position.coords.longitude,

accuracy:
position.coords.accuracy,

date:
new Date().toISOString()

};


save();

render();

alert(
"Position enregistrée pour « " +
erables[index].name +
" »."
);

},

function(error){

let message =
"Impossible d'obtenir la position.";

if(error.message){

message +=
"\n\n" +
error.message;

}

alert(message);

},

{
enableHighAccuracy:true,
timeout:20000,
maximumAge:0
}

);

}


/* =========================================================
   EFFACER GPS
========================================================= */

function clearLocation(index){

erables[index].gps = null;

save();

render();

}


/* =========================================================
   GOOGLE MAPS
========================================================= */

function openMaps(index){

const gps =
erables[index].gps;


if(!gps){

return;

}


const url =
"https://www.google.com/maps?q=" +
gps.latitude +
"," +
gps.longitude;


window.open(url,"_blank");

}


/* =========================================================
   DISTANCE GPS
========================================================= */

function distanceGPS(
lat1,
lon1,
lat2,
lon2
){

const R = 6371000;

const rad =
Math.PI / 180;

const dLat =
(lat2-lat1) * rad;

const dLon =
(lon2-lon1) * rad;


const a =
Math.sin(dLat/2) *
Math.sin(dLat/2)
+
Math.cos(lat1*rad) *
Math.cos(lat2*rad) *
Math.sin(dLon/2) *
Math.sin(dLon/2);


return 2 *
R *
Math.asin(
Math.sqrt(a)
);

}


/* =========================================================
   ÉRABLE LE PLUS PROCHE
========================================================= */

function findNearest(){

if(!navigator.geolocation){

alert(
"La géolocalisation n'est pas disponible."
);

return;

}


navigator.geolocation.getCurrentPosition(

function(position){

let nearest = null;


erables.forEach(function(maple,index){

if(!maple.gps){

return;

}


const distance =
distanceGPS(

position.coords.latitude,

position.coords.longitude,

maple.gps.latitude,

maple.gps.longitude

);


if(
nearest === null ||
distance < nearest.distance
){

nearest = {

index:index,
distance:distance

};

}

});


const box =
document.getElementById("nearestBox");


box.classList.remove("hidden");


if(nearest === null){

box.innerHTML =
"📍 Aucun érable n'a encore de position enregistrée.";

return;

}


const maple =
erables[nearest.index];


let distanceText;


if(nearest.distance < 1000){

distanceText =
Math.round(nearest.distance) +
" m";

}else{

distanceText =
(nearest.distance / 1000)
.toFixed(2) +
" km";

}


box.innerHTML =
"📍 L'érable le plus proche est <strong>" +
escapeHtml(maple.name) +
"</strong> à " +
distanceText +
".";


},

function(error){

alert(
"Impossible d'obtenir votre position : " +
error.message
);

},

{
enableHighAccuracy:true,
timeout:20000,
maximumAge:0
}

);

}


/* =========================================================
   PHOTOS
========================================================= */

function photoKey(index){

return "photos-erable-" +
erables[index].name;

}


function getPhotos(index){

try{

return JSON.parse(
localStorage.getItem(
photoKey(index)
) || "[]"
);

}catch(error){

return [];

}

}


function setPhotos(index,photos){

localStorage.setItem(
photoKey(index),
JSON.stringify(photos)
);

}


/* =========================================================
   REDIMENSIONNEMENT PHOTO
========================================================= */

function resizeImage(file){

return new Promise(function(resolve,reject){

const reader =
new FileReader();


reader.onload = function(event){

const image =
new Image();


image.onload = function(){

const MAX = 1600;

let width =
image.width;

let height =
image.height;


if(width > MAX || height > MAX){

if(width > height){

height =
height * MAX / width;

width = MAX;

}else{

width =
width * MAX / height;

height = MAX;

}

}


const canvas =
document.createElement("canvas");

canvas.width =
Math.round(width);

canvas.height =
Math.round(height);


const context =
canvas.getContext("2d");


context.drawImage(
image,
0,
0,
canvas.width,
canvas.height
);


resolve(
canvas.toDataURL(
"image/jpeg",
0.82
)
);

};


image.onerror = reject;

image.src =
event.target.result;

};


reader.onerror = reject;

reader.readAsDataURL(file);

});

}


/* =========================================================
   AJOUT PHOTOS
========================================================= */

async function addPhotos(index,input){

const files =
Array.from(input.files);


if(files.length === 0){

return;

}


const photos =
getPhotos(index);


for(const file of files){

try{

const image =
await resizeImage(file);


photos.push({

id:
Date.now() +
Math.random(),

src:image,

date:
new Date().toISOString()

});

}catch(error){

console.error(error);

}

}


setPhotos(index,photos);

input.value = "";

render();

}


/* =========================================================
   AFFICHAGE PHOTOS
========================================================= */

function loadPhotos(index){

const container =
document.getElementById(
"photos-" + index
);


if(!container){

return;

}


const photos =
getPhotos(index);


container.innerHTML =
photos.map(function(photo){

return `

<div class="photo-box">

<img
src="${photo.src}"
alt="Photo de ${escapeHtml(erables[index].name)}"
>

<button
class="action danger"
onclick="deletePhoto(${index},'${photo.id}')"
>
Supprimer
</button>

</div>

`;

}).join("");


updatePhotoCount();

}


/* =========================================================
   SUPPRIMER PHOTO
========================================================= */

function deletePhoto(index,id){

const photos =
getPhotos(index)
.filter(function(photo){

return String(photo.id) !== String(id);

});


setPhotos(index,photos);

render();

}


/* =========================================================
   SUPPRIMER TOUTES LES PHOTOS D'UN ÉRABLE
========================================================= */

function deletePhotos(index){

localStorage.removeItem(
photoKey(index)
);

}


/* =========================================================
   COMPTEUR PHOTOS
========================================================= */

function updatePhotoCount(){

let total = 0;


erables.forEach(function(maple,index){

total +=
getPhotos(index).length;

});


document.getElementById(
"photoCount"
).textContent = total;

}


/* =========================================================
   EXPORT
========================================================= */

function exportCollection(){

const data =
JSON.stringify(
erables,
null,
2
);


const blob =
new Blob(
[data],
{
type:"application/json"
}
);


const url =
URL.createObjectURL(blob);


const link =
document.createElement("a");


link.href = url;

link.download =
"ma-collection-erables.json";


document.body.appendChild(link);

link.click();

document.body.removeChild(link);

URL.revokeObjectURL(url);

}


/* =========================================================
   IMPORT
========================================================= */

function importCollection(input){

const file =
input.files[0];


if(!file){

return;

}


const reader =
new FileReader();


reader.onload =
function(){

try{

const imported =
JSON.parse(reader.result);


if(!Array.isArray(imported)){

throw new Error();

}


erables =
imported.map(function(item){

return {

name:
item.name || "Érable",

gps:
item.gps || null

};

});


save();

render();

alert(
"Import terminé : " +
erables.length +
" érables."
);


}catch(error){

alert(
"Le fichier sélectionné n'est pas valide."
);

}

};


reader.readAsText(file);

}


/* =========================================================
   INITIALISATION
========================================================= */

render();

</script>

</body>
</html>
